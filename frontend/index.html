<!doctype html>
<html class="scroll-smooth" lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>OID — Observatoire Inondations &amp; Dommages</title>
    <meta
      name="description"
      content="Plateforme citoyenne et territoriale de veille, d'alerte et de suivi des crues et inondations en temps réel."
    />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <script>
      (function () {
        var stored = localStorage.getItem('oid-theme');
        var theme;
        if (stored === 'light' || stored === 'dark') {
          theme = stored;
        } else {
          var p = window.location.pathname;
          var isAgent =
            p.startsWith('/login') ||
            p.startsWith('/verification') ||
            p.startsWith('/coordination') ||
            p.startsWith('/enquete') ||
            p.startsWith('/agent');
          theme = isAgent ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (typeof tailwind !== 'undefined') {
        tailwind.config = {
          darkMode: 'class',
          corePlugins: {
            preflight: false,
          },
          theme: {
            extend: {
              fontFamily: {
                sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
                display: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              },
              colors: {
                surface: 'var(--s1)',
                surface2: 'var(--s2)',
                surface3: 'var(--s3)',
                ink: 'var(--tx)',
                ink2: 'var(--tx2)',
                ink3: 'var(--tx3)',
                line: 'var(--line)',
                line2: 'var(--line2)',
                accent: 'var(--water)',
                'accent-hi': 'var(--water-hi)',
                brand: {
                  50: '#eff6ff',
                  100: '#dbeafe',
                  500: '#2563eb',
                  600: '#1d4ed8',
                  700: '#1d40b0',
                  900: '#0f172a',
                  950: '#060d1f',
                },
                alert: {
                  red: '#ef4444',
                  orange: '#f97316',
                  amber: '#eab308',
                  emerald: '#10b981',
                },
              },
            },
          },
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
